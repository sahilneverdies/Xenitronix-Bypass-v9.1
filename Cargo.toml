[package]
name = "xenitronix"
version = "9.1.0"
edition = "2021"
authors = ["Dev SAHIL"]
description = "Xenitronix Bypass v9.1 - In-Game + MITM Protection (Rust)"

[[bin]]
name = "xenitronix"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }

# HTTP server + client (MITM proxy + UID fetch)
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

# TLS interception (MITM)
rcgen = { version = "0.13", features = ["pem"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
dashmap = "5"
dirs = "5"
webpki-roots = "0.26"

# AES-128-CBC crypto
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
block-padding = { version = "0.3", features = ["std"] }
hex = "0.4"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# JSON + serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Discord bot
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "cache",
] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
bytes = "1"
parking_lot = "0.12"
once_cell = "1"
lazy_static = "1"

# Windows-only: WinDivert + helpers
[target.'cfg(target_os = "windows")'.dependencies]
windivert = "0.3"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
